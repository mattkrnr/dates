# Date ideas. Each idea starts with "- name:".
#
#   name:     what the date is (required)
#   address:  full street address, or "home"
#   when:     weeknight | weekend | either
#   daylight: true if it needs daylight, false if it works after dark
#   season:   any | winter | summer | spring | fall  (or a list, like [spring, summer, fall])
#   outdoor:  true if it's outside (gets a weather heads-up), false otherwise
#   budget:   "$" | "$$" | "$$$"   (keep the quotes)
#   energy:   chill | medium | active
#   notes:    optional, shown when it's picked
#   link:     optional website
#   lat/lng:  optional, only if the address lookup puts it in the wrong spot
#
# These are SAMPLE ideas near 08551. Swap in your own!

