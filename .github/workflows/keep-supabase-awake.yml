# Free Supabase projects pause after a week with no database activity.
# This makes one tiny, harmless request every 3 days so date history never goes to sleep.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://bkhhcsmbpnlgsnbzblov.supabase.co/rest/v1/rpc/check_code" \
            -H "apikey: sb_publishable_JdJa4qMmvvrD96M3fDvbQA_WGQSvzfu" \
            -H "Content-Type: application/json" \
            -d '{"p_list":"keepalive","p_code":"ping"}')
          echo "Supabase answered $code"
          test "$code" = "200"
